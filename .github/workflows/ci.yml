name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: lint, types and tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install project + dev tools (pinned)
        run: uv sync --extra dev

      - name: ruff format
        run: uv run ruff format --check .

      - name: ruff lint
        run: uv run ruff check .

      - name: mypy
        run: uv run mypy src scripts

      - name: pytest (offline — sockets disabled, no real model)
        run: uv run pytest -q -m "not slow"

  evaluation-report:
    name: mock evaluation report (harness only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install project + dev tools (pinned)
        run: uv sync --extra dev

      # The mock client answers with the expected JSON: this validates the
      # evaluation harness itself, never a model, and never touches the network.
      - name: Generate docs/results.md with the mock client
        run: uv run python scripts/evaluate.py --mock --out results-mock.md

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-report-mock
          path: results-mock.md
